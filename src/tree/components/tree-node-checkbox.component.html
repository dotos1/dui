
    <ng-container *mobxAutorun="{dontDetach: true}">
      <mat-checkbox class="tree-node-checkbox"
                    [checked]="node.isSelected"
                    (change)="node.mouseAction('checkboxClick', $event)"
                    [indeterminate]="node.isPartiallySelected"
                    fxFlex>
                    {{label|translate}}
      </mat-checkbox>
    </ng-container>
