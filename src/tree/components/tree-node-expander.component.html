<ng-container *ngIf="node">
  <span *ngIf="node.hasChildren" class="toggle-children-wrapper" aria-hidden="true">
    <mat-icon *ngIf="!node.options.expanderAlign || node.options.expanderAlign === 'left'" aria-hidden="true">
      {{ node.isExpanded ? 'keyboard_arrow_down' : 'keyboard_arrow_right' }}
    </mat-icon>
    <mat-icon *ngIf="node.options.expanderAlign && node.options.expanderAlign === 'right'" aria-hidden="true">
      {{ node.isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
    </mat-icon>
  </span>
  <span *ngIf="!node.hasChildren" class="toggle-children-placeholder" aria-hidden="true"></span>
</ng-container>
