<div class="dui-dialog-wrapper">
  <ng-content
    *ngIf="dialogStatus.length > 0"
    select="[duiDialogStatus]"
  ></ng-content>
  <section class="dui-dialog">
    <div mat-dialog-title *ngIf="dialogTitle.length > 0">
      <ng-content select="[duiDialogTitle]"></ng-content>
    </div>
    <mat-dialog-content
      class="dui-dialog-content"
      *ngIf="dialogContent.length > 0"
    >
      <ng-content select="[duiDialogContent]"></ng-content>
    </mat-dialog-content>
    <mat-dialog-actions
      class="dui-dialog-actions"
      *ngIf="dialogActions.length > 0"
    >
      <span class="dui-dialog-spacer"></span>
      <ng-content select="[duiDialogActions]"></ng-content>
    </mat-dialog-actions>
  </section>
</div>
