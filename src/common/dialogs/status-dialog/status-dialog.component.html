<dui-dialog class="dui-status-dialog">
  <div duiDialogStatus class="dui-status-dialog-state" [ngClass]="state">
    <mat-icon>
      {{ getStatusIcon() }}
    </mat-icon>
  </div>
  <!-- Dialog title and the close icon -->
  <ng-container duiDialogTitle>
    <div class="dui-status-dialog-title">
      <span *ngIf="title" class="">{{ title|translate  }}</span>
      <button
        mat-icon-button
        class="dui-status-dialog__icon-button"
        (click)="close()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </ng-container>
  <ng-container duiDialogContent>
    <span class="dui-dialog-message">
      {{ message |translate }}
      <div
        class="dui-status-dialog__toggle-details"
        role="button"
        tabindex="0"
        *ngIf="details"
        (click)="toggleDetails()"
        (keydown.enter)="toggleDetails()"
      >
        {{
          (showDetails
            ? detailsLabels?.hideDetailsLabel
            : detailsLabels?.showDetailsLabel) | translate
        }}
        <mat-icon
          [ngClass]="{
            'dui-status-dialog__arrow-icon': true,
            close: !showDetails,
            open: showDetails
          }"
          >arrow_drop_down</mat-icon
        >
      </div>
      <div *ngIf="showDetails">{{ details|translate  }}</div>
    </span>
  </ng-container>
  <ng-container duiDialogActions>
    <button
      mat-raised-button
      color="primary"
      class="dui-status-dialog___button"
      (click)="close()"
    >
      {{ closeButton }}
    </button>
  </ng-container>
</dui-dialog>
