<button mat-icon-button class="mat-elevation-z1" [matMenuTriggerFor]="colorMenu"
 (menuOpened)="onMenuOpen()"
  [ngClass]="selectedPalette + '-' + selectedHue">
  <mat-icon >palette</mat-icon>
</button>

<mat-menu #colorMenu="matMenu" class="color-picker-menu mat-elevation-z8">

  <header [ngClass]="selectedColor?.class || 'accent'" class="mat-elevation-z4"
    style="display: flex; flex-direction: row; box-sizing: border-box; justify-content: space-between; align-items: center; align-content: center;">

    <button mat-icon-button class="secondary-text" [style.visibility]="view === 'hues' ? 'visible' : 'hidden'"
      (click)="goToPalettesView($event)" aria-label="Palette">
      <mat-icon class="s-20 mat-icon-rtl-mirror">arrow_back</mat-icon>
    </button>

    <span *ngIf="selectedColor?.palette">
      {{selectedColor.palette}} {{selectedColor.hue}}
    </span>

    <span *ngIf="!selectedColor?.palette">
      {{'COMMON.SELECTCOLOR'| translate}}
    </span>

    <button mat-icon-button class="remove-color-button secondary-text" (click)="removeColor($event)"
      aria-label="Remove color" matTooltip="Remove color">
      <mat-icon class="s-20">delete</mat-icon>
    </button>
  </header>

  <div [ngSwitch]="view" class="views">

    <div class="view" *ngSwitchCase="'palettes'">
      <div style="display: flex; flex-direction: row; flex-wrap: wrap; box-sizing: border-box; justify-content: flex-start; align-items: flex-start; align-content: flex-start;" class="colors">
        <div class="color" style="display: flex; flex-direction: row; box-sizing: border-box; justify-content: center; align-items: center; align-content: center;" *ngFor="let color of (colors | keys)"
          [ngClass]="color.key" [class.selected]="selectedPalette === color.key"
          (click)="selectPalette($event,color.key)">
        </div>
      </div>
    </div>
    <div class="view" *ngSwitchCase="'hues'">
      <div style="display: flex; flex-direction: row; flex-wrap: wrap; box-sizing: border-box; justify-content: flex-start; align-items: flex-start; align-content: flex-start;" class="colors" >
        <div class="color" style="flex-direction: row; box-sizing: border-box; justify-content: center; align-items: center; align-content: center;" *ngFor="let hue of hues"
          [style.display]="(selectedPalette === 'dui-white' && hue !== '500' || selectedPalette === 'dui-black' && hue !== '500') ? 'none' : 'flex'"
          [ngClass]="selectedPalette + '-' + hue" [class.selected]="selectedHue === hue"
          (click)="selectHue($event, hue)">
        </div>
      </div>
    </div>
  </div>
</mat-menu>
