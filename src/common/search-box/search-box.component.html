<div class="search-box">
  <button
    mat-icon-button
    [disabled]="disabled" 
    type="button"
    class="search-icon"
    (click)="searchClicked()"
  >
    <mat-icon *ngIf="searchVisible && !alwaysVisible">{{ backIcon }}</mat-icon>
    <mat-icon *ngIf="!searchVisible || alwaysVisible">{{
      searchIcon
    }}</mat-icon>
  </button>
  <search-input
    #searchInput
    [class.search-input-expanded]="alwaysVisible || searchVisible"
    [class.search-input-collapsed]="!(alwaysVisible || searchVisible)"
    [debounce]="debounce"
    [(ngModel)]="value"
    [showUnderline]="showUnderline"
    [placeholder]="placeholder"
    [clearIcon]="clearIcon"
    (searchDebounce)="handleSearchDebounce($event)"
    (onSearch)="handleSearch($event)"
    (onClear)="handleClear(); toggleVisibility()"
    (blurSearch)="handleBlur()"
  ></search-input>
</div>
