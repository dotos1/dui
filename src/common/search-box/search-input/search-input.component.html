<div class="search-input">
  <mat-form-field
    class="search-input-field"
    [class.mat-hide-underline]="!showUnderline"
    [appearance]="themeService.formType|async"
  >
    <input
      matInput
      #searchElement
      type="search"
      [(ngModel)]="value"
      [placeholder]="placeholder"
      (blur)="handleBlur()"
      (keyup.enter)="handleSearch($event)"
    />
    <span
      matSuffix
      *ngIf="
        appearance === 'fill' ||
        appearance === 'outline' 
      "
    >
      <ng-template [ngTemplateOutlet]="clearButton"></ng-template>
    </span>
  </mat-form-field>
</div>
<ng-template #clearButton>
  <button
    mat-icon-button
    class="search-input-clear"
    type="button"
    [@searchState]="
      searchElement.value ? 'show' : isRTL ? 'hide-left' : 'hide-right'
    "
    (click)="clearSearch()"
  >
    <mat-icon>{{ clearIcon }}</mat-icon>
  </button>
</ng-template>
