<expansion-panel-header>
  <panel-title>{{label|translate}}</panel-title>
  <panel-description *ngIf="description">{{description|translate}}</panel-description>
</expansion-panel-header>
<mat-divider ></mat-divider>

<div [class.dui-expanded]="expanded" [class.dui-collapsed]="!expanded" class="expansion-panel-content" [id]="id">
  <div class="expansion-panel-body">
    <ng-content></ng-content>
    <ng-container #content></ng-container>
  </div>
  <dui-action-row *ngIf="buttons">
    <ng-container #actionbar></ng-container>
  </dui-action-row>
</div>
