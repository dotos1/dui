
<mat-tab-group mat-stretch-tabs="false" class="tab-group" style="margin: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%;" [headerPosition]="tabPosition" dynamicHeight='true' 
[selectedIndex]='activeTab' (focusChange)="focusChange($event)" (selectedTabChange)="tabChange($event)">
  <mat-tab *ngFor="let tab of tabs" [disabled]="tab.disabled" [labelClass]="tab.hidden ? 'dui-tab-hidden' : ''">
      <ng-template mat-tab-label>{{tab.title|translate}}</ng-template>
      <ng-container #tabpanel></ng-container>
  </mat-tab>
</mat-tab-group>
