<div style="margin: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; display: flex; flex-direction: column; flex: 1 1 0%; box-sizing: border-box; overflow: hidden;">
  <mat-card style="flex: 1 1 1e-9px; display: flex; flex-direction: column; box-sizing: border-box;" [ngStyle]='cardStyle'>
    <mat-card-header *ngIf="title || ltbar|| rtbar"  style="min-height: 48px;" >
      <mat-card-title *ngIf="title || ltbar|| rtbar" style="display: flex; flex-direction: row; box-sizing: border-box; width: 100%;">
          <div class="card-title-content" style="display: flex; flex-direction: row; flex: 1 1 0%; box-sizing: border-box;">
            <span style='flex: 0 0 auto; align-self: center;display:flex;'>
              <ng-container #lefttopbar></ng-container>
              <div  style="margin:auto"> {{title|translate }}</div>
            </span>
            <span style='flex: 1'></span>
           <ng-content select="dui-search-box"></ng-content> 
            <ng-container #righttopbar></ng-container>
          </div>
      </mat-card-title>
      <mat-card-subtitle *ngIf="subtitle !== ''">{{subtitle|translate }}</mat-card-subtitle>
    </mat-card-header>
    <mat-divider *ngIf="title || subtitle || ltbar|| rtbar"></mat-divider>
    <mat-card-content style="flex: 1 1 1e-9px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;" [ngStyle]='contenStyle'>
      <div [ngStyle]='getContentLayoutStyle()'>
        <ng-content></ng-content>
        <ng-container #panel></ng-container>
      </div>
      <span class="righttop">
        <ng-container #rightopfab></ng-container>
      </span>
      <span class="rightbottom">
        <ng-container #righbottomfab></ng-container>
      </span>
    </mat-card-content>
    <mat-divider *ngIf="buttons.length>0||pageBar!==undefined"></mat-divider>
    <mat-card-actions *ngIf="buttons.length>0||pageBar!==undefined" align="end">
      <mat-paginator #pagebar *ngIf="pageBar!==undefined" [hidePageSize]="true" [showFirstLastButtons]="true"
        [length]="pageBar.total" [pageSize]="1" [pageIndex]="pageBar.page" (page)="pageBar.doLoad($event)">
      </mat-paginator>
      <ng-container #actionbar></ng-container>
    </mat-card-actions>
  </mat-card>
</div>
