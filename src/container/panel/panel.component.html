
<div #containerOutlet style="display: flex; box-sizing: border-box; margin: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%;" [style.flex-direction]="fxLayout === 'column' ? 'column' : 'row'" [ngStyle]="style">
    <ng-container *ngTemplateOutlet="contentTpl"></ng-container>
</div>
<ng-template #contentTpl>
        <ng-container  #panel></ng-container>
        <ng-template  ngFor let-area [ngForOf]="displayedAreas" let-index="index" let-last="last">
          <split-gutter class="split-gutter" *ngIf="last === false && area.comp.split" [order]="index*2+1" [direction]="fxLayout"  [useTransition]="useTransition" [size]="gutterSize" [disabled]="disabled" 
          (mousedown)="startDragging($event, index*2+1, index+1)"></split-gutter>
        </ng-template>
        <ng-container *ngTemplateOutlet="panelContentTpl"></ng-container>
 </ng-template>
 <ng-template #panelContentTpl>  <ng-content></ng-content> </ng-template>
