
<button mat-icon-button
        type="button"
        [disabled]="!leftPaginationEnabled"
        (click)="handlePaginatorClick('before', $event)"
        (touchstart)="handlePaginatorTouchStart('before', $event)"
        class="toggle-header-pagination-button"
        [class.fill-height]="fillHeight"
        [class.mat-32]="!isMdLg"
        [class.mat-24]="isMdLg">
  <mat-icon class="mat-icon-rtl-mirror">chevron_left</mat-icon>
</button>
<div #toggleGroupContainer class="toggle-container"
     [class.disable-pagination]="disablePagination"
     [class.fill-height]="fillHeight"
     [class.extra-padding]="extraPadding"
     *ngIf="(useSelect$ | async) === false; else select" >
  <mat-button-toggle-group #toggleGroup
                           class="toggle-header"
                           [class.fill]="(appearance === 'fill' || appearance === 'fill-invert')"
                           [class.invert]="appearance === 'fill-invert'"
                           [class.primary-fill]="primaryBackground"
                           [class.ignore-md-lg]="ignoreMdLgSize"
                           [class.disabled]="disabled"
                           [name]="name"
                           [(ngModel)]="value"
                           (ngModelChange)="valueChange.emit(value)">
    <mat-button-toggle *ngFor="let option of options; trackBy: trackByHeaderOption" [value]="option.value" [disabled]="disabled">{{ option.name }}</mat-button-toggle>
  </mat-button-toggle-group>
</div>
<button mat-icon-button
        type="button"
        [disabled]="!rightPaginationEnabled"
        (click)="handlePaginatorClick('after', $event)"
        (touchstart)="handlePaginatorTouchStart('after', $event)"
        class="toggle-header-pagination-button"
        [class.fill-height]="fillHeight"
        [class.mat-32]="!isMdLg"
        [class.mat-24]="isMdLg">
  <mat-icon class="mat-icon-rtl-mirror">chevron_right</mat-icon>
</button>
<ng-template #select>
  <mat-form-field appearance="outline" class="toggle-header-select"
                  [class.fill-height]="fillHeight"
                  subscriptSizing="dynamic">
    <mat-select [(ngModel)]="value" (ngModelChange)="valueChange.emit($event)" [disabled]="disabled">
      <mat-option *ngFor="let option of options" [value]="option.value"> {{ option.name }}</mat-option>
    </mat-select>
  </mat-form-field>
</ng-template>
