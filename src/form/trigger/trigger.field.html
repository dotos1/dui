<input matInput #input [id]="id" [tabindex]="tabindex" [attr.disabled]="disabled" [formControl]="formControl"
  [errorStateMatcher]="errorStateMatcher" [formAttributes]="field"  [value]="field.inputValue ?field.inputValue:''"  
  [required]="required" autocomplete="off" (click)="_handleFocus()" style="flex: 1 1 0%; box-sizing: border-box;" matTooltip={{toolTip|translate}}
  matTooltipPosition='below' flex />

<ng-template #matPrefix>
  <mat-icon *ngIf="field.icon.indexOf('svg')===-1"  (click)="open()">{{field.icon}}</mat-icon>
  <mat-icon *ngIf="field.icon.indexOf('svg')!==-1" svgIcon="{{field.icon}}" (click)="open()"></mat-icon>
</ng-template>

<ng-template #matSuffix>
  <div class="mat-mdc-select-arrow-wrapper" (click)="open()">
    <div class="mat-mdc-select-arrow"></div>
  </div>
</ng-template>
