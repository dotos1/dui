  <mat-slide-toggle
       [id]="id"
       [style.width]="'100%'"
       [formControl]="formControl"
       [name]="name"
       [color]="field.color"
       [checked]="formControl.value"
       [formAttributes]="field"
       [labelPosition]="field.labelPosition"
       matTooltip={{toolTip|translate}}
       matTooltipPosition='below'
       (click)="click($event)" 
       style="padding-bottom: 20px; flex: 1 1 0%; box-sizing: border-box;">
    {{field.label|translate}}
  </mat-slide-toggle>

  <input type="hidden"  class="mdc-text-field__input"/>
