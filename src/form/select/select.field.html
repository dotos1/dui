<ng-template #selectAll let-selectOptions="selectOptions">
  <mat-option (click)="toggleSelectAll(selectOptions)">
    <mat-pseudo-checkbox class="mat-mdc-option-pseudo-checkbox" [state]="getSelectAllState(selectOptions)">
    </mat-pseudo-checkbox>
    {{ field.selectAllOption |translate}}
  </mat-option>
</ng-template>

<mat-select [id]="id" [formControl]="formControl" [formAttributes]="field"  [placeholder]="field.placeholder |translate"
  [tabindex]="field.tabindex || 0"  [compareWith]="field.compareWith || compareWith" [multiple]="field.multiple"
  (selectionChange)="change($event)" [errorStateMatcher]="errorStateMatcher" [aria-labelledby]="_getAriaLabelledby()"
  [disableOptionCentering]="field.disableOptionCentering" (openedChange)="openedChanged($event)"
  [panelClass]="phone ? 'dui-phone-select-panel' : ''">

  <div *ngIf="phone" class="dui-phone-select-head">
    <button mat-icon-button type="button" class="dui-phone-select-close" [attr.aria-label]="'CORE.CLOSE' | translate" (click)="matSelect.close()">
      <mat-icon>close</mat-icon>
    </button>
    <span>{{ field.label | translate }}</span>
  </div>

  <!-- 停用 / 只读态：显示服务端回显的文字。已选项的文字要等选项渲染（翻译管道异步）才有，首次渲染时停用的下拉显示空白（实测：首个表单的停用下拉全空，再开别的表单才正常） -->
  <mat-select-trigger *ngIf="echoText">{{ echoText }}</mat-select-trigger>

  <ng-container>
    <mat-option *ngIf="field.hasSearch">
      <mat-select-search [formControl]="selectSearchControl" [searching]="searching"  >
      </mat-select-search>
    </mat-option>
    <mat-option *ngIf="field.hasBlankOption" value=""></mat-option>
    <!-- 停用 / 只读态：远程选项只在展开时才取，已选值对不上任何选项时 mat-select 显示空白；这里补一个只放服务端回显文字的选项（停用态展不开，不会出现在面板里） -->
    <mat-option *ngIf="fallbackOption as fb" class="dui-select-echo" [value]="fb.value">{{ fb.text }}</mat-option>
    <ng-container *ngIf="field.options | selectOptionsPipe:field | async as selectOptions">
    <ng-container *ngIf="field.multiple && field.selectAllOption" [ngTemplateOutlet]="selectAll"
      [ngTemplateOutletContext]="{ selectOptions: selectOptions }">
    </ng-container>
    <ng-container *ngFor="let item of selectOptions; trackBy: trackByOption">
      <mat-optgroup *ngIf="item.group" [label]="item.label |translate">
        <mat-option *ngFor="let child of item.group; trackBy: trackByOption" [value]="child.value" [disabled]="child.disabled">
          {{child.label |translate}}
        </mat-option>
      </mat-optgroup>
      <mat-option *ngIf="!item.group" [value]="item.value" [disabled]="item.disabled" >
        {{ item.label |translate }}
      </mat-option>
    </ng-container>
  </ng-container>
  </ng-container>
</mat-select> 

<ng-template #matSuffix>
  <button *ngIf="(field.required===undefined|| field.required===false)&&value" mat-icon-button type="button" [attr.aria-label]="'CORE.CLOSE' | translate" (click)="clear()">
    <mat-icon (click)="clear()">close</mat-icon>
  </button>
</ng-template>
<input type="hidden"  class="mdc-text-field__input" value="true"/>
