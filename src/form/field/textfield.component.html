<ng-container *ngIf="field.options||field.remote;else noAutocomplete">
  <input matInput flex #autoCompleteInput [id]="id" [type]="field.type || 'text'" [readonly]="field.readonly"
    [errorStateMatcher]="errorStateMatcher" [formControl]="formControl"
    [formAttributes]="field" [tabindex]="field.tabindex || 0"
    [placeholder]="field.placeholder|translate" matTooltip={{toolTip|translate}}  matTooltipPosition='below'
    [matAutocomplete]="auto" [value]="field.inputValue ?field.inputValue:''"   
    (click)="openChanged($event)"/>
  <mat-autocomplete  #auto="matAutocomplete" > 
    <mat-option *ngFor="let option of filteredOptions | async" [value]="getValue(option)">
      {{getLabel(option)}}
    </mat-option>
  </mat-autocomplete>
</ng-container>
<ng-template #noAutocomplete>
  <ng-container>
    <input matInput flex [id]="id" [type]="field.type || 'text'" [readonly]="field.readonly"
      [errorStateMatcher]="errorStateMatcher" [formControl]="formControl" [formAttributes]="field"
      [tabindex]="field.tabindex || 0" [placeholder]="field.placeholder|translate"
      matTooltip={{toolTip|translate}} [value]="field.inputValue ?field.inputValue:''"  matTooltipPosition='below' autocomplete="off"  />
  </ng-container>
</ng-template>
