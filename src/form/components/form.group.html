<div style="display: flex; flex-direction: row; flex-wrap: wrap; box-sizing: border-box; justify-content: flex-start; align-items: center; align-content: center;">
  <ng-template let-item ngFor [ngForOf]="field.fieldGroup">
    <div *ngIf="item.xtype!=='hidden-field'" class="pad-xs"
      [ngStyle]="getStyle(item)">
      <dui-field *ngIf="item.xtype!=='hidden-field'" hide-deprecation [field]="item" [ngClass]="item.className">
      </dui-field>
      <ng-container #content>
        <ng-content></ng-content>
      </ng-container>
    </div>
    <dui-field *ngIf="item.xtype==='hidden-field'" [field]="item"></dui-field>
  </ng-template>
</div>
