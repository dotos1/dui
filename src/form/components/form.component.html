<div fxLayout="row wrap" fxLayoutAlign="start center" style="padding-top:8px;">
  <ng-template let-item ngFor [ngForOf]="items">
    <div *ngIf="item.xtype!=='hidden-field'" class="pad-xs" [fxFlex]="item.flex ? item.flex : 100"
      [ngStyle]="getStyle(item)">
      <dui-field *ngIf="item.xtype!=='hidden-field'" hide-deprecation [field]="item" [ngClass]="item.className"
        (modelChange)="changeModel($event)">
      </dui-field>
      <ng-container #content>
        <ng-content></ng-content>
      </ng-container>
    </div>
    <dui-field *ngIf="item.xtype==='hidden-field'" [field]="item"></dui-field>
  </ng-template>
</div>
