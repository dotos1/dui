
<mat-menu #childMenu="matMenu" [ngClass]="menuClass">
  <ng-container *ngFor="let child of children">
    <ng-container *ngIf="child.type !== 'radio' && child.children && child.children.length > 0">
      <button mat-menu-item *ngIf="(child.title&&child.title!==''||child.icon) &&child.hidden!==true" 
       [matMenuTriggerFor]="menu.childMenu" [disabled]="child.disable" [ngStyle]="child.style"  
         [matTooltip]="child.toolTip | translate" matTooltipPosition='below'    
          #menuTrigger="matMenuTrigger"     [matTooltipDisabled]="menuTrigger.menuOpen"  >
      <dui-icon *ngIf="child.showIcon!==false"  [value]="child.icon" [iconStyle]="child.iconStyle"  style="padding-bottom: 0px;"></dui-icon>
      <span *ngIf="child.title&&child.title!==''" >
        {{(child.title) | translate }}
      </span>
      </button>
      <dui-menu-item #menu [children]="child.children"  [dense]="dense" [ownerCt]='ownerCt'></dui-menu-item>
    </ng-container>

    <ng-container *ngIf="child.type === 'radio' && child.children && child.children.length > 0">
      <button mat-menu-item *ngIf="(child.title&&child.title!=='') &&child.hidden!==true"  
       [matMenuTriggerFor]="childRadioMenu" [disabled]="child.disable" [ngStyle]="child.style" 
        [matTooltip]="child.toolTip | translate" matTooltipPosition='below'    
           #menuTrigger="matMenuTrigger"   [matTooltipDisabled]="menuTrigger.menuOpen"  >
          <!-- <mat-icon *ngIf="parentItem&&child.value === parentItem.value">check</mat-icon> -->
          <dui-icon *ngIf="child.showIcon!==false"  [value]="child.icon"  style="padding-bottom: 0px;" ></dui-icon>
        <span >{{(child.title) | translate }}</span>
        <span *ngIf="child.shortcut" style='flex: 1 1 auto;min-width: 20px;'></span>
        <span  class="menu-bar-item-menu-item--command" *ngIf="child.shortcut">{{child.shortcut| translate}}</span>
      </button>
      <mat-menu #childRadioMenu [ngClass]="menuClass">
        <button mat-menu-item *ngFor="let radioChild of child.children" [disabled]="radioChild.disable" [ngStyle]="radioChild.style" (click)="onRadioMenuItemClick(child, radioChild, $event)" role="menuitemradio" [attr.aria-checked]="child.value === radioChild.value"  [matTooltip]="child.toolTip | translate" matTooltipPosition='below'>
          <mat-icon *ngIf="child.value === radioChild.value"  style="padding-bottom: 0px;">check</mat-icon>
          <mat-icon *ngIf="child.value !== radioChild.value"   style="padding-bottom: 0px;"></mat-icon>
          <span [ngClass]="radioChild.classes" >{{(radioChild.title)| translate }}</span>
          <span *ngIf="radioChild.shortcut" class="menu-bar-item-menu-item--command">{{radioChild.shortcut| translate}}</span>
        </button>
      </mat-menu>
    </ng-container>

    <!-- Handle leaf node menu items -->
    <ng-container *ngIf="!child.children || child.children.length === 0&&child.hidden!==true" [ngSwitch]="child.type">
      <ng-container *ngSwitchCase="'radio'">
        <button mat-menu-item *ngIf="(child.title&&child.title!=='' ||child.icon ) &&child.hidden!==true" [ngStyle]="child.style"   [disabled]="child.disable"  (click)="click(child, $event)"
        [matTooltip]="child.toolTip | translate" matTooltipPosition='below'>
          <mat-icon *ngIf="child.value === value">check</mat-icon>
          <mat-icon *ngIf="child.value !== value" ></mat-icon>
          <span *ngIf="child.title&&child.title!==''" class='menu-title'  >{{(child.title)| translate}}</span>
          <span *ngIf="child.shortcut" style='flex: 1 1 auto;min-width: 20px;'></span>
          <span  *ngIf="child.shortcut" class="menu-bar-item-menu-item--command">{{ child.shortcut| translate }}</span>
        </button>
    </ng-container>
    <ng-container *ngSwitchCase="'checkbox'">
      <button mat-menu-item *ngIf="child.hidden!==true"  [disabled]="child.disable"  role="menuitemcheckbox" [ngStyle]="child.style" [attr.aria-checked]="child.value === true"  [matTooltip]="child.toolTip | translate" matTooltipPosition='below'  (click)="onCheckboxMenuItemClick(child, $event)">
        <mat-icon *ngIf="child.value">check</mat-icon>
        <mat-icon *ngIf="child.value === false||child.value ===undefined"></mat-icon>
        <span >{{(child.title) | translate }}</span>
        <span *ngIf="child.shortcut" style='flex: 1 1 auto;min-width: 20px;'></span>
        <span  *ngIf="child.shortcut" class="menu-bar-item-menu-item--command">{{ child.shortcut| translate }}</span>
      </button>
    </ng-container>
      <ng-container *ngSwitchCase="'divider'">
        <mat-divider  *ngIf="child.hidden!==true" ></mat-divider>
      </ng-container>
      <ng-container *ngSwitchCase="'custom'">
        <!-- <button mat-menu-item  style="padding:0 0px !important" > -->
          <dui-dynamic-component  class="dynamic-menu" *ngIf="child.hidden!==true" [config]="child" [xtype]="child.xtype"></dui-dynamic-component>
       <!-- </button> -->
      </ng-container>
      <ng-container *ngSwitchDefault >
        <button mat-menu-item *ngIf="(child.title&&child.title!=='' ||child.icon ) &&child.hidden!==true" [ngStyle]="child.style"  [ngClass]="child.classes"   (click)="click(child, $event)" [disabled]="child.disable"
        [matTooltip]="child.toolTip | translate" matTooltipPosition='below'>
          <dui-icon  *ngIf="child.showIcon!==false"   [value]="child.icon" [iconStyle]="child.iconStyle" style="padding-bottom: 0px;">

          </dui-icon>
          <span *ngIf="child.title&&child.title!==''"  >
            {{(child.title)| translate}}</span>
          <span *ngIf="child.shortcut" style='flex: 1 1 auto;min-width: 20px;'></span>
          <span  *ngIf="child.shortcut" class="menu-bar-item-menu-item--command">{{ child.shortcut| translate }}</span>
        </button>
    </ng-container>
    </ng-container>
  </ng-container>
</mat-menu>
