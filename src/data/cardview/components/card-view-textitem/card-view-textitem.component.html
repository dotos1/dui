<div [ngSwitch]="templateType">
  <div *ngSwitchDefault>
    <mat-form-field class="dui-property-field dui-card-textitem-field"
      [ngClass]="{ 'dui-property-read-only': !isEditable }" [floatLabel]="'always'"  [appearance]="themeService.formType|async">
      <mat-label [attr.data-automation-id]="'card-textitem-label-' + property.key"  *ngIf="showProperty || isEditable">
        {{ property.label | translate }}
      </mat-label>
      <input matInput *ngIf="!property.multiline" class="dui-property-value" [placeholder]="property.default"
        [(ngModel)]="editedValue" (blur)="update()" (keydown.enter)="update()" [disabled]="!isEditable"
        (dblclick)="copyToClipboard(property.displayValue)" matTooltipShowDelay="1000"
        [matTooltip]="'METADATA.ACTIONS.COPY_TO_CLIPBOARD' | translate" [matTooltipDisabled]="isEditable"
        [attr.data-automation-id]="'card-textitem-value-' + property.key">
      <textarea matInput *ngIf="property.multiline" matTextareaAutosize matAutosizeMaxRows="2" matAutosizeMaxRows="5"
        class="dui-property-value" [placeholder]="property.default" [(ngModel)]="editedValue" (blur)="update()"
        (keydown.enter)="update()" [disabled]="!isEditable"
        [attr.data-automation-id]="'card-textitem-value-' + property.key" style="overflow:hidden"></textarea>
      <button mat-button matSuffix class="dui-property-clear-value" *ngIf="isEditable" 
        aria-label="Clear" (click)="editedValue=''">
        <mat-icon>cancel</mat-icon>
      </button>
      <mat-icon matSuffix *ngIf="isEditable" [attr.title]="'METADATA.ACTIONS.EDIT' | translate"
        class="dui-textitem-edit-icon">mode_edit</mat-icon>
    </mat-form-field>
  </div>
  <mat-error [attr.data-automation-id]="'card-textitem-error-' + property.key" class="dui-textitem-editable-error"
    *ngIf="hasErrors">
    <ul>
      <li *ngFor="let errorMessage of errorMessages">{{ errorMessage | translate }}</li>
    </ul>
  </mat-error>

  <div *ngSwitchCase="'chipsTemplate'" class="dui-property-field dui-textitem-chip-list-container">
    <mat-chip-grid   #chipList class="dui-textitem-chip-list">
      <mat-chip-row *ngFor="let propertyValue of editedValue; let idx = index" [removable]="isEditable"
        (removed)="removeValueFromList(idx)">
        {{ propertyValue }}
        <mat-icon *ngIf="isEditable" matChipRemove>cancel</mat-icon>
      </mat-chip-row>
    </mat-chip-grid>
    <mat-form-field *ngIf="isEditable" class="dui-property-field dui-textitem-chip-list-input"
      [ngClass]="{ 'dui-property-read-only': !isEditable }" [floatLabel]="'always'"  [appearance]="themeService.formType|async">
      <mat-label [attr.data-automation-id]="'card-textitem-label-' + property.key"  *ngIf="showProperty || isEditable">
        {{ property.label | translate }}
      </mat-label>
      <input matInput class="dui-property-value" [placeholder]="property.default | translate"
        [matChipInputFor]="chipList" [matChipInputAddOnBlur]="true" (matChipInputTokenEnd)="addValueToList($event)"
        [attr.data-automation-id]="'card-textitem-editchipinput-' + property.key">
      <mat-icon matSuffix class="dui-textitem-edit-icon">mode_edit</mat-icon>
    </mat-form-field>
  </div>
  <div *ngSwitchCase="'clickableTemplate'" role="button" class="dui-textitem-clickable"
    [ngClass]="{ 'dui-property-read-only': !isEditable }"
    [attr.data-automation-id]="'card-textitem-toggle-' + property.key" (click)="clicked()"
    style="display: flex; flex-direction: row; box-sizing: border-box; justify-content: space-between; align-items: center; align-content: center;">
    <mat-form-field class="dui-property-field dui-card-textitem-field" [floatLabel]="'always'"  [appearance]="themeService.formType|async">
      <mat-label [attr.data-automation-id]="'card-textitem-label-' + property.key"  *ngIf="showProperty || isEditable">
        {{ property.label | translate }}
      </mat-label>
      <input matInput [type]=property.inputType class="dui-property-value"
        [ngClass]="{ 'dui-textitem-clickable-value': !isEditable }" [placeholder]="property.default"
        [(ngModel)]="editedValue" (blur)="update()" (keydown.enter)="update()" [disabled]="!isEditable"
        [attr.data-automation-id]="'card-textitem-value-' + property.key">
      <button mat-icon-button matSuffix style="flex: 0 0 auto; box-sizing: border-box;" *ngIf="showClickableIcon" class="dui-textitem-action"
        [attr.title]="'ACTIONS.EDIT' | translate"
        [attr.data-automation-id]="'card-textitem-clickable-icon-' + property.key">
        <mat-icon class="dui-textitem-icon">{{ property?.icon }}</mat-icon>
      </button>
    </mat-form-field>
  </div>
  <div *ngSwitchCase="'emptyTemplate'">
    <span class="dui-textitem-default-value">{{ property.default | translate }}</span>
  </div>
</div>
