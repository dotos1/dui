<div  class="dui-property-label">{{ property.label | translate }}</div>
  <div class="dui-property-value dui-card-view-array-item-container" (click)="clicked()">
    <ng-container *ngIf="(property.displayValue | async) as items; else elseEmptyValueBlock">
      <mat-chip-set #chipSet  *ngIf="items.length > 0; else elseEmptyValueBlock"
        data-automation-id="card-arrayitem-chip-list-container">
        <ng-container *ngIf="displayCount() > 0; else withOutDisplayCount">
          <mat-chip *ngFor="let item of items.slice(0, displayCount())" (click)="clicked()"
            [attr.data-automation-id]="'card-arrayitem-chip-' + item.value">
            <mat-icon *ngIf="item?.icon" class="dui-array-item-icon">{{item.icon}}</mat-icon>
            <span>{{item?.value}}</span>
          </mat-chip>
          <mat-chip *ngIf="items.length > displayCount()" data-automation-id="card-arrayitem-more-chip"
            [matMenuTriggerFor]="menu">
            <span>{{items.length - displayCount()}} {{'CORE.CARDVIEW.MORE' | translate}}</span>
          </mat-chip>
        </ng-container>
        <ng-template #withOutDisplayCount>
          <mat-chip *ngFor="let item of items" (click)="clicked()"
            [attr.data-automation-id]="'card-arrayitem-chip-' + item.value">
            <mat-icon *ngIf="item?.icon" class="dui-array-item-icon">{{item.icon}}</mat-icon>
            <span>{{item?.value}}</span>
          </mat-chip>
        </ng-template>
      </mat-chip-set>
      <mat-menu #menu="matMenu">
        <mat-card class="dui-array-item-more-chip-container">
          <mat-card-content>
            <mat-chip-set>
              <mat-chip (click)="clicked()" *ngFor="let item of items.slice(displayCount(), items.length)"
                [attr.data-automation-id]="'card-arrayitem-chip-' + item.value">
                <mat-icon *ngIf="item?.icon" class="dui-array-item-icon">{{item.icon}}</mat-icon>
                <span>{{item?.value}}</span>
              </mat-chip>
            </mat-chip-set>
          </mat-card-content>
        </mat-card>
      </mat-menu>
    </ng-container>
    <ng-template #elseEmptyValueBlock>
      <span class="dui-card-array-item-default"
        data-automation-id="card-arrayitem-default">{{ property?.default | translate }}</span>
    </ng-template>
    <button mat-icon-button *ngIf="showClickableIcon()" class="dui-array-item-action"
      [attr.aria-label]="'METADATA.ACTIONS.EDIT' | translate" [attr.title]="'METADATA.ACTIONS.EDIT' | translate"
      [attr.data-automation-id]="'card-array-item-clickable-icon-' + property.key">
      <mat-icon class="dui-array-item-icon">{{property.icon}}</mat-icon>
    </button>
  </div>
