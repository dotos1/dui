<div class="datatable-header-cell-template-wrap">
  <ng-template *ngIf="isTarget" [ngTemplateOutlet]="targetMarkerTemplate"
    [ngTemplateOutletContext]="targetMarkerContext">
  </ng-template>
  <label *ngIf="isCheckboxable" class="datatable-checkbox">
    <mat-checkbox class="tree-node-checkbox" [checked]="allRowsSelected" (change)="select.emit(!allRowsSelected)"
       [indeterminate]="partialRowsSelected"
      fxFlex>
    </mat-checkbox>  </label>
  <span *ngIf="!column.headerTemplate" class="datatable-header-cell-wrapper">
    <span class="datatable-header-cell-label draggable" (click)="onSort()" [innerHTML]="name|translate "> </span>
  </span>
  <ng-template *ngIf="column.headerTemplate" [ngTemplateOutlet]="column.headerTemplate"
    [ngTemplateOutletContext]="cellContext">
  </ng-template>
  <span (click)="onSort()" [class]="sortClass"> </span>
</div>
