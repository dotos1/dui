<div class="datatable-footer-inner" [ngClass]="{ 'selected-count': selectedMessage }" [style.height.px]="footerHeight">
  <ng-template *ngIf="footerTemplate" [ngTemplateOutlet]="footerTemplate.template" [ngTemplateOutletContext]="{
          rowCount: rowCount,
          pageSize: pageSize,
          selectedCount: selectedCount,
          curPage: curPage,
          offset: offset
        }">
  </ng-template>
  <div class="page-count" *ngIf="!footerTemplate">
    <span *ngIf="selectedMessage"> {{ selectedCount?.toLocaleString() }} {{ selectedMessage }} / </span>
    {{ rowCount?.toLocaleString() }} {{ totalMessage }}
  </div>
  <dui-paging-bar *ngIf="!footerTemplate" [pageLinkCount]="(media.registerQuery('md') | async) ? 0 : 5"
    [firstLast]='true' [total]="rowCount" [pageSize]="pageSize" [initialPage]="offset+1" [hidden]="!isVisible"
    (change)="page.emit($event)">
  </dui-paging-bar>
</div>
