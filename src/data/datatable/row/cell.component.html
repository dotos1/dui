<div class="datatable-body-cell-label" [style.margin-left.px]="calcLeftMargin(column, row)">
  <label
    *ngIf="column.checkboxable && (!displayCheck || isDisplayCheck(row, column, value))"
    class="datatable-checkbox"
  >
  <mat-checkbox class="tree-node-checkbox" [checked]="isSelected" (change)="onCheckboxChange($event)" fxFlex>
  </mat-checkbox>
  </label>
  <ng-container *ngIf="column.isTreeColumn">
    <button
      *ngIf="!column.treeToggleTemplate"
      class="datatable-tree-button"
      [disabled]="treeStatus === 'disabled'"
      (click)="onTreeAction()"
    >
      <span>
        <i *ngIf="treeStatus === 'loading'" class="icon datatable-icon-collapse"></i>
        <i *ngIf="treeStatus === 'collapsed'" class="icon datatable-icon-up"></i>
        <i *ngIf="treeStatus === 'expanded' || treeStatus === 'disabled'" class="icon datatable-icon-down"></i>
      </span>
    </button>
    <ng-template
      *ngIf="column.treeToggleTemplate"
      [ngTemplateOutlet]="column.treeToggleTemplate"
      [ngTemplateOutletContext]="{ cellContext: cellContext }"
    >
    </ng-template>
  </ng-container>

  <span *ngIf="!column.cellTemplate" [title]="sanitizedValue" [innerHTML]="value|translate"> </span>
  <ng-template
    #cellTemplate
    *ngIf="column.cellTemplate"
    [ngTemplateOutlet]="column.cellTemplate"
    [ngTemplateOutletContext]="cellContext"
  >
  </ng-template>
</div>
