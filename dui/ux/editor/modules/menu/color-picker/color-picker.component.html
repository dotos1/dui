<div class="Editor__MenuItem--IconContainer" [class.Editor__MenuItem--Active]="isActive || showPopup"
  [class.Editor--Disabled]="!canExecute" [innerHTML]="icon | sanitizeHtml" (mousedown)="togglePopup($event)"
  [title]="title">
</div>

<div *ngIf="showPopup" class="Editor__Popup">
  <div *ngFor="let colorGroup of presets; trackBy: trackByIndex" class="Editor__ColorContainer">
    <button class="Editor__Color" *ngFor="let color of colorGroup; trackBy: trackByIndex"
      [ngStyle]="{backgroundColor: color, color:getContrastYIQ(color)}" [title]="color"
      (mousedown)="onColorSelect($event, color)"
      [ngClass]="{'Editor__Color--Active': activeColors.includes(color)}"></button>
  </div>

  <button class="Editor__MenuItem--Button" (mousedown)="remove($event)" [disabled]="!isActive">
    {{getLabel('remove')}}
  </button>
</div>
