<mat-form-field  [popoverTriggerFor]="errorPopover" [showPopOver]="errorState" subscriptSizing="dynamic"
[hideRequiredMarker]="true" [floatLabel]="field.floatLabel" [appearance]="field.appearance" [color]="color"   [style.width]="'100%'">
  <ng-container #fieldComponent></ng-container>
  <mat-label *ngIf="field.label && field.hideLabel !== true">
    {{ field.label |translate}}
    <span *ngIf="field.required && field.hideRequiredMarker !== true" class="mat-mdc-form-field-required-marker">*</span>
  </mat-label>
  <ng-container matPrefix>
    <ng-container *ngTemplateOutlet="field.prefix ? field.prefix : fieldConfig._matPrefix"></ng-container>
  </ng-container>
  <ng-container matSuffix>
    <ng-container *ngTemplateOutlet="field.suffix ? field.suffix : fieldConfig._matSuffix"></ng-container>
  </ng-container>
  <mat-hint *ngIf="field.description"  [id]="null">{{ field.description|translate }}</mat-hint>
</mat-form-field>

<popover  #errorPopover="duiPopover"
 [popoverOverlapTrigger]="false"
 [popoverPositionY]="'above'">
  <div class="error-container">
      <mat-error [id]="null">
        <validation-message [field]="field"></validation-message>
      </mat-error>
  </div>
</popover>
