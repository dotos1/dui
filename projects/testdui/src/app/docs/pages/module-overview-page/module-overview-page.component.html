<ng-container *ngIf="api$ | async as api; else noData">
  <p class="overview__import">
    <code>import {{ '{' }} ... {{ '}' }} from '{{ api.importPath }}';</code>
  </p>

  <ul class="overview__exports" *ngIf="api.exports.length">
    <li *ngFor="let item of api.exports">
      <span class="overview__kind">{{ item.kind }}</span>
      <span class="overview__name">{{ item.name }}</span>
      <span class="overview__summary">{{ summaryOf(item) || '暂无描述' }}</span>
    </li>
  </ul>

  <h2 class="overview__subheading" *ngIf="api.suggestedUsageSnippet">用法示例</h2>
  <dui-highlight *ngIf="api.suggestedUsageSnippet"
                 [content]="api.suggestedUsageSnippet"
                 [copyCodeToClipboard]="true"></dui-highlight>
</ng-container>

<ng-template #noData>
  <p class="overview__empty">该模块的文档数据尚未生成，请运行 <code>npm run docs:generate</code>。</p>
</ng-template>
