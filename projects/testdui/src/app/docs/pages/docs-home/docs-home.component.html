<div class="docs-home">
  <h1 class="docs-home__title">DUI 组件文档</h1>
  <p class="docs-home__lead">
    &#64;dotos/dui 是一个 Angular 组件库，按功能划分为 14 个分类、96 个可独立引入的子模块。
    左侧导航按分类列出全部模块；每个模块都有完整的 API 参考（Inputs / Outputs / 方法 / 属性），
    常用组件另附可交互示例。
  </p>

  <div class="docs-home__grid" *ngIf="manifest$ | async as manifest">
    <a class="docs-home__card"
       *ngFor="let category of manifest.categories"
       [routerLink]="['/', category.id]">
      <div class="docs-home__card-id">{{ category.id }}</div>
      <div class="docs-home__card-count">{{ category.moduleCount }} 个模块</div>
    </a>
  </div>
</div>
