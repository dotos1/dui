<mat-sidenav-container class="site-shell">
  <mat-sidenav-content class="site-shell__main">
    <mat-toolbar color="primary" class="site-toolbar">
      <a routerLink="/" class="site-toolbar__brand">
        <svg class="site-toolbar__logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="duiLogoGradTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2196f3"/>
              <stop offset="100%" stop-color="#5c6bc0"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#duiLogoGradTop)"/>
          <path d="M10,9 H18 C25,9 29,13.8 29,20 C29,26.2 25,31 18,31 H10 Z" fill="#fff"/>
          <rect x="25.5" y="24.5" width="12" height="12" rx="3.5" fill="url(#duiLogoGradTop)"/>
          <rect x="27" y="26" width="9" height="9" rx="2.5" fill="#ff9800"/>
        </svg>
        <span>DUI</span>
      </a>

      <nav class="site-toolbar__nav">
        <a mat-button routerLink="/" routerLinkActive="site-toolbar__link--active"
           [routerLinkActiveOptions]="{ exact: true }">{{ 'NAV.HOME' | translate }}</a>
        <a mat-button routerLink="/tutorial" routerLinkActive="site-toolbar__link--active">{{ 'NAV.TUTORIAL' | translate }}</a>
        <a mat-button routerLink="/components" routerLinkActive="site-toolbar__link--active">{{ 'NAV.COMPONENTS' | translate }}</a>
      </nav>

      <span class="site-toolbar__spacer"></span>

      <button mat-button [matMenuTriggerFor]="langMenu" class="site-toolbar__lang" [attr.aria-label]="'NAV.SWITCH_LANG' | translate">
        <mat-icon>language</mat-icon>
        {{ currentLangLabel }}
      </button>
      <mat-menu #langMenu="matMenu">
        <button mat-menu-item *ngFor="let lang of langs" (click)="switchLang(lang.code)">
          {{ lang.label }}
        </button>
      </mat-menu>

      <a mat-icon-button href="https://github.com/dotos-ts/dui" target="_blank" rel="noopener"
         aria-label="GitHub" class="site-toolbar__github">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </svg>
      </a>

      <button mat-icon-button (click)="themeSidenav.toggle()" aria-label="主题设置" matTooltip="主题设置">
        <mat-icon>tune</mat-icon>
      </button>
    </mat-toolbar>

    <div class="site-body">
      <router-outlet />
    </div>
  </mat-sidenav-content>

  <mat-sidenav #themeSidenav mode="over" position="end" class="theme-settings-sidenav">
    <app-theme-settings (closed)="themeSidenav.close()"></app-theme-settings>
  </mat-sidenav>
</mat-sidenav-container>
