<speed-dial #speeddial [(open)]="open" [direction]="direction" [type]="type" [animationMode]="animationMode" [fixed]="fixed">
  <speed-dial-trigger [type]="type" [spin]="spin" [disabled]="disabled">
    <button *ngIf="type==='mat-fab'" mat-fab [disabled]="disabled" [color]="color" [ngStyle]='style'
      [disableRipple]="disableRipple" [matTooltip]="title| translate" matTooltipPosition='below'>
      <dui-icon [value]="icon" [iconStyle]="style"></dui-icon>
    </button>
    <button *ngIf="type==='mat-mini-fab'" mat-mini-fab [disabled]="disabled" [color]="color" [ngStyle]='style'
      [disableRipple]="disableRipple" [matTooltip]="title | translate"  matTooltipPosition='below'>
      <dui-icon [value]="icon" [iconStyle]="style"></dui-icon>
    </button>
  </speed-dial-trigger>
  <speed-dial-actions >
    <button [color]="item.color" *ngFor="let item of items;  let i = index;" mat-mini-fab
      (click)="item.handler(item,$event)"  [matTooltip]="item.text| translate">
      <dui-icon [value]="item.icon" [iconStyle]="style"></dui-icon>
    </button>
  </speed-dial-actions>
</speed-dial>
