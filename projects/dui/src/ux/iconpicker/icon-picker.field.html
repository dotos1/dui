

   <input  matInput #input
          [id]="id"
          [tabindex]="tabindex"
          [attr.disabled]="disabled"
          [formControl]="formControl"
          [errorStateMatcher]="errorStateMatcher"
          [formAttributes]="field"
          [required]="required"
          autocomplete="off"
          (click)="_handleFocus()"
          matTooltip={{toolTip}} matTooltipPosition='below' />

  <ng-template #matPrefix>
      <mat-icon *ngIf="_type==='FONT'" style="padding-right: 30px"  (click)="open()">{{icon}}</mat-icon>
      <mat-icon *ngIf="_type==='SVG'" svgIcon="{{icon}}" (click)="open()"></mat-icon>
      <mat-icon *ngIf="_type==='EXTRA'" [ngStyle]="fontStyle"  (click)="open()">{{icon}}</mat-icon>
  </ng-template>

  <ng-template #matSuffix>
      <div  class="icon-picker-select-arrow-wrapper" (click)="open()">
        <div class="icon-picker-select-arrow"></div>
    </div>
  </ng-template>
