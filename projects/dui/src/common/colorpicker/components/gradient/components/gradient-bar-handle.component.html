<div   tabIndex={0}  (blur)="handleBlur()"  (focus)="handleFocus()"  id=${`gradient-handle-${i}`}
      (mousedown)="handleDown($event)"   [ngClass]="context.classes.rbgcpGradientHandleWrap"  [ngStyle]="leftStyle" >
      <div  [ngStyle]="context.handleStyle(isSelected)"  [ngClass]="context.classes.rbgcpGradientHandle" >
          <div  *ngIf="isSelected" style=" width: 5; height: 5;border-radius: '50%';  background: 'white'">
      </div>
    </div>
