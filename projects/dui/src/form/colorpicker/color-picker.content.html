<div cdkTrapFocus class="color-picker-content" [id]="host.id" [attr.mode]="host.mode">
  <header [ngClass]="selectedColor?.class || 'accent'" class="mat-elevation-z4" fxLayout="row"
    fxLayoutAlign="space-between center">
    <button mat-icon-button class="secondary-text" [style.visibility]="view === 'hues' ? 'visible' : 'hidden'"
      (click)="goToPalettesView($event)" aria-label="Palette">
      <mat-icon class="s-20">arrow_back</mat-icon>
    </button>
    <span *ngIf="selectedColor?.palette">
      {{selectedColor.palette}} {{selectedColor.hue}}
    </span>
    <button mat-icon-button class="remove-color-button secondary-text" (click)="removeColor($event)"
      aria-label="Remove color" matTooltip="Remove color">
      <mat-icon class="s-20">delete</mat-icon>
    </button>
  </header>
  <div [ngSwitch]="view" class="views">
    <div class="view" *ngSwitchCase="'palettes'">
      <div fxLayout="row wrap" fxLayoutAlign="start start" class="colors" perfectScrollbar>
        <div class="color" fxLayout="row" fxLayoutAlign="center center" *ngFor="let color of (colors | keyvalue)"
          [ngClass]="color.key" [class.selected]="selectedPalette === color['key']"
          (click)="selectPalette($event, color.key)">
        </div>
      </div>
    </div>
    <div class="view" *ngSwitchCase="'hues'">
      <div fxLayout="row wrap" fxLayoutAlign="start start" class="colors" perfectScrollbar>
        <div class="color" fxLayout="row" fxLayoutAlign="center center" *ngFor="let hue of hues"
          [fxHide]="selectedPalette === 'dui-white' && hue !== '500' || selectedPalette === 'dui-black' && hue !== '500'"
          [ngClass]="selectedPalette + '-' + hue" [class.selected]="selectedHue === hue"
          (click)="selectHue($event, hue)">
        </div>
      </div>
    </div>
  </div>
</div>
