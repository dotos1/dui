<ng-container *ngIf="field.options||field.remote;else noAutocomplete">
  <div class="chip-list-wrapper">
    <mat-chip-set #chipList>
      <ng-container *ngFor="let select of selectData">
        <mat-chip class="cardinal-colors" (click)="removeChip(select)">
          {{ select.value }}
          <mat-icon class="mat-chip-remove">cancel</mat-icon>
        </mat-chip>
      </ng-container>
    </mat-chip-set>
  </div> 
  <input matInput flex  #autoCompleteInput 
      [id]="id"  
      [type]="field.type || 'text'" 
      [readonly]="field.readonly" 
      [errorStateMatcher]="errorStateMatcher" 
      [formControl]="formControl"
      [formAttributes]="field" 
      (keypress)="onKeyPress($event)"
      [tabindex]="field.tabindex || 0"
      [placeholder]="field.placeholder|translate" 
      matTooltip={{toolTip|translate}} 
      matTooltipPosition='below'
      [matAutocomplete]="auto"
      autocomplete="'on'"
      (click)="openChanged()"/>
 
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
    <mat-option *ngFor="let data of filteredData | async">
      <div (click)="optionClicked($event, data)">
        <mat-checkbox [checked]="data.selected" 
          (change)="toggleSelection(data)" 
          (click)="$event.stopPropagation()">
          {{getLabel(data)}}
        </mat-checkbox>
      </div>
    </mat-option>
  </mat-autocomplete>
 </ng-container> 
 <ng-template #noAutocomplete>
  <ng-container>
    <input matInput flex [id]="id" [type]="field.type || 'text'" [readonly]="field.readonly"
      [errorStateMatcher]="errorStateMatcher" [formControl]="formControl" [formAttributes]="field"
      (keypress)="onKeyPress($event)" [tabindex]="field.tabindex || 0" [placeholder]="field.placeholder|translate"
      matTooltip={{toolTip|translate}} [value]="field.inputValue ?field.inputValue:''"  matTooltipPosition='below' autocomplete="off"  />
  </ng-container>
</ng-template>
