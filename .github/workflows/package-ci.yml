name: Package CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to registry'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dotos1'

      - name: Configure Registry Auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if [ -n "${{ secrets.DOTOS_REGISTRY_TOKEN }}" ]; then
            echo "@dotos:registry=${{ secrets.DOTOS_REGISTRY_URL || 'http://192.168.1.123:4873' }}" >> ~/.npmrc
            echo "${{ secrets.DOTOS_REGISTRY_URL || '//192.168.1.123:4873' }}/:_authToken=${{ secrets.DOTOS_REGISTRY_TOKEN }}" >> ~/.npmrc
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: yarn install --prefer-offline || yarn install

      - name: Build Package
        run: npm run package

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: npm run publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: 'https://npm.pkg.github.com'
