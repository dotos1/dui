# 先轻后重（2026-11-24，用户反映 CI 总是卡死）：secret-scan / ts-suppress-gate / no-legacy-vendor-gate 原是独立工作流，
# 同时涌进 dotos-apps 池排队；现在并进本工作流作为前置作业，全过之后 build-and-publish（装依赖、构建、发布）才开始。
# 作业名（scan-secrets（发现即红）、类型检查压制只减不增、build-and-publish）一个没改：分支保护按名字匹配。
# 发布路径（打 v* 标签 / workflow_dispatch publish=true）依赖链：前置作业 -> build-and-publish（其内「Publish」步骤）。
# 同一 PR 再推送取消上一轮；master 推送、标签、手动发布不被取消。
name: Package CI/CD

on:
  push:
    branches: [ master, feat/ng22-m3 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, feat/ng22-m3 ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to registry'
        required: false
        type: boolean
        default: false
      version:
        description: '指定发布版本（如 8.0.0-next.3）；留空则沿用自动补丁号。含预发布后缀时以 next 标签发布，不动 latest'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: scan-secrets（发现即红）
    # 私有时用自托管 dotos-apps（托管分钟额度为 0）；仓库公开后自动改用 GitHub 托管 ubuntu-latest（公开仓库免费），
    # 避免外部 fork 的 PR 在自托管机器上执行代码。
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","dotos-apps"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true                 # 自托管工作区跨 job 复用：先清掉上次的未跟踪文件
          persist-credentials: false  # 不把令牌留在 runner 上的 .git/config
      - name: scan-secrets 自检（埋点必须判红）
        run: bash gates/scan-secrets-selftest.sh
      - name: scan-secrets
        run: bash gates/scan-secrets.sh --no-gitleaks .

  ts-suppress-gate:
    name: 类型检查压制只减不增
    # 私有时用自托管 dotos-apps（托管分钟额度为 0）；仓库公开后自动改用 GitHub 托管 ubuntu-latest（公开仓库免费），
    # 避免外部 fork 的 PR 在自托管机器上执行代码。
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","dotos-apps"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 压制门自测（区分力：新增必红、调低必绿）
        run: node gates/ts-suppress-gate.mjs --selftest
      - name: 压制门（本仓库）
        run: |
          set +e -uo pipefail   # 先写摘要再按门程序的退出码退出
          node gates/ts-suppress-gate.mjs --root . 2>&1 | tee "$RUNNER_TEMP/ts-suppress.out"
          rc=${PIPESTATUS[0]}
          { echo '### 类型检查压制门（只减不增，目标 0）'; echo '```'; cat "$RUNNER_TEMP/ts-suppress.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  no-legacy-vendor-gate:
    name: 旧组件库痕迹零容忍
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","dotos-apps"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 门自测（区分力：命中样例必红、干净样例必绿）
        run: node tools/gates/no-legacy-vendor-gate.mjs --selftest
      - name: 门（本仓库）
        run: node tools/gates/no-legacy-vendor-gate.mjs --root .

  build-and-publish:
    needs: [secret-scan, ts-suppress-gate, no-legacy-vendor-gate]
    # 私有时用自托管 dotos-apps（托管分钟额度为 0）；仓库公开后自动改用 GitHub 托管 ubuntu-latest（公开仓库免费），
    # 避免外部 fork 的 PR 在自托管机器上执行代码。
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","dotos-apps"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          clean: true                 # 自托管工作区跨 job 复用：先清掉上次的未跟踪文件
          persist-credentials: false  # 不把令牌留在 runner 上的 .git/config

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dotos1'

      - name: Configure Registry Auth
        run: |
          # package.json 用别名 "@dotos/x": "npm:@dotos1/x@…"：yarn 1 按别名的 scope（@dotos）找 registry 决定带不带令牌，
          # 所以 @dotos 与 @dotos1 都指向 GitHub Packages；always-auth 让下载 /download/ 包文件也带令牌
          {
            echo "@dotos1:registry=https://npm.pkg.github.com/"
            echo "@dotos:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"  # 令牌只写进 job 临时目录，不写 runner 的 ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DOTOS_PKG_TOKEN || secrets.GITHUB_TOKEN }}  # 组织级读包令牌：GITHUB_TOKEN 读不了别的仓库发布的 @dotos1/* 包（401）

      - name: Install Dependencies
        run: yarn install --prefer-offline || yarn install

      - name: 类型检查门（G-TSC，103 个入口点）
        run: npm run gate:tsc

      - name: 语种包门（G-I18N，键集合一致、非英语不照抄英文）
        run: npm run gate:i18n

      - name: JSDoc 类型说明与代码一致（复核 F6）
        run: npm run gate:jsdoc

      - name: ESM 导入门（G-ESM，禁止 CommonJS lodash / lodash/fp 目录导入）
        run: npm run gate:esm

      - name: any 棘轮门自检（G-ANY，checker 计数的区分力）
        run: npm run gate:any:selftest

      - name: any 棘轮门（G-ANY，真实 any 与空对象类型只许降）
        run: npm run gate:any

      - name: Angular 22 双兼容符号与配置门（ng22-compat-gate）
        run: npm run gate:ng22-compat

      - name: Angular Material 22 样式引用门（style-ref-gate）
        run: npm run gate:style-ref

      - name: Build Package
        run: |
          if [ -n "${VERSION}" ]; then
            # 指定版本：不走 prebuild 的自动补丁号（预发布号 patch 会变成正式版 8.0.0）
            (cd src && npm --no-git-tag-version --allow-same-version version "${VERSION}")
            npm run build-dui && npm run npm_pack
          else
            npm run package
          fi
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: 产物依赖与布局清零门（G-PKG-DEPS，零幽灵依赖、零死依赖、禁 ngx-flexible-layout 回流）
        run: npm run gate:pkg-deps

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: |
          # 预发布版本一律打 next 标签，不动 latest
          V=$(node -p "require('./dist/dui/package.json').version")
          case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
          echo "发布 @dotos1/dui@$V，标签 $TAG"
          cd dist/dui && rm -f *.tgz && npm publish --ignore-scripts --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: 'https://npm.pkg.github.com'

      - name: 清理令牌文件
        if: always()
        run: rm -f "$RUNNER_TEMP/.npmrc"
