# 密钥扫描门：PR 与推送都对本仓库整个工作区跑 gates/scan-secrets.sh（先跑区分力自检 gates/scan-secrets-selftest.sh），
# 发现即红。输出只有 文件:行 与规则名，不打印密钥。确认过的误报登记在仓库根 .scan-secrets-allow
# （格式：路径 glob|规则名|该行须匹配的 ERE —— 第三段尽量写，只放过占位符那一行）；真泄露不进白名单：轮换密钥、从代码里拿掉。
# 脚本随仓库保存（公开仓库不能引用私有仓库的 action）。
name: secret-scan

on:
  pull_request:
  push:
    branches: [master]   # 分支推送不再单独扫：PR 上已扫过（同一提交扫两遍要排两次队）；合进 master 再扫一次
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-secrets（发现即红）
    # 私有时用自托管 dotos-apps（托管分钟额度为 0）；仓库公开后自动改用 GitHub 托管 ubuntu-latest（公开仓库免费），
    # 避免外部 fork 的 PR 在自托管机器上执行代码。
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","dotos-apps"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true                 # 自托管工作区跨 job 复用：先清掉上次的未跟踪文件
          persist-credentials: false  # 不把令牌留在 runner 上的 .git/config
      - name: scan-secrets 自检（埋点必须判红）
        run: bash gates/scan-secrets-selftest.sh
      - name: scan-secrets
        run: bash gates/scan-secrets.sh --no-gitleaks .
