# 密钥扫描门（待办「密钥管理：scan-secrets 进 CI」）：PR 与推送都对本仓库整个工作区跑运维仓库维护的
# deploy/release-tools/scan-secrets.sh（经 dotos1/dotos-ops/.github/actions/scan-secrets 调用，先跑区分力自检），
# 发现即红。输出只有 文件:行 与规则名，不打印密钥。确认过的误报登记在仓库根 .scan-secrets-allow
# （格式：路径 glob|规则名|该行须匹配的 ERE —— 第三段尽量写，只放过占位符那一行）；真泄露不进白名单：轮换密钥、从代码里拿掉。
#
# runner：2026-10-22 起改自托管 dotos-apps（托管分钟用完、支出上限 $0，托管任务不启动）。脚本只要 bash + grep；
# 私有仓库、组织已关闭 fork PR 跑 workflow，PR 只来自有写权限的成员；checkout 每次清工作区、不在 runner 上留令牌。
# 前提：dotos-ops 私有，需在它的 Settings → Actions → General → Access 放行同组织仓库，否则 Set up job 阶段报找不到 action。
name: secret-scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-secrets（发现即红）
    runs-on: [self-hosted, Linux, X64, dotos-apps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true                 # 自托管工作区跨 job 复用：先清掉上次的未跟踪文件
          persist-credentials: false  # 不把令牌留在 runner 上的 .git/config
      - uses: dotos1/dotos-ops/.github/actions/scan-secrets@master
